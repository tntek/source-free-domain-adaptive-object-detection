MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  WEIGHT: "/home/eason/SFOD/vgg16_caffe.pth"
  MASK_ON: False
  BACKBONE:
    NAME: "build_vgg_backbone"
  RPN:
    IN_FEATURES: ["vgg_block4"]
    PRE_NMS_TOPK_TEST: 6000
    POST_NMS_TOPK_TEST: 300
    ANCHOR_SIZES: (128, 256, 512)
  ROI_HEADS:
    IN_FEATURES: ["vgg_block4"]
    NUM_CLASSES: 8
INPUT:
  MIN_SIZE_TRAIN: (600,)
  MIN_SIZE_TEST: 600
DATASETS:
  TRAIN: ("cityscape_2007_train_s",)
  TEST: ("cityscape_2007_test_t",)
SOLVER:
  BASE_LR: 0.001
  WEIGHT_DECAY: 0.0001
  STEPS: (50000, )
  MAX_ITER: 70000
  IMS_PER_BATCH: 1
OUTPUT_DIR: "foggy_baseline"
